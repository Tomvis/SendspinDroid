    <circle r="22" fill="none" stroke="#F5EDE0" stroke-opacity=".7" stroke-width="1.5"></circle>
    <g stroke="#F5EDE0" stroke-opacity=".6" stroke-width="1">
      <line x1="-40" y1="0" x2="-24" y2="0"></line>
      <line x1="40" y1="0" x2="24" y2="0"></line>
      <line x1="0" y1="-40" x2="0" y2="-24"></line>
      <line x1="0" y1="40" x2="0" y2="24"></line>
    </g>
  </g>
  <rect width="800" height="800" fill="url(#g2)"></rect>
  <rect width="800" height="800" filter="url(#grain)"></rect>
